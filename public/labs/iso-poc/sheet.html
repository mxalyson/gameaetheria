<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Aetheria — folha de sprites (PoC isométrico)</title>
<style>html,body{margin:0;background:#2a2f46;color:#e9e4ff;font:13px system-ui}canvas{display:block}#info{padding:8px 12px}</style></head>
<body><div id="info">carregando…</div><canvas id="c"></canvas>
<script type="module">
import { bakeAtlas, drawFrame, atlasMiB } from './src/atlas.js';
import { drawMage, MAGE_FRAME, MAGE_PIVOT } from './src/sprites/rig-mage.js';
import { drawSlime, SLIME_FRAME, SLIME_PIVOT } from './src/sprites/rig-slime.js';
import { MAGE_CLIPS, SLIME_CLIPS } from './src/anim.js';
const q = new URLSearchParams(location.search), who = q.get('who') ?? 'mage', bake = Number(q.get('bake') ?? 1.5);
const t0 = performance.now();
const cfg = who === 'mage'
  ? { name: 'mage', frame: MAGE_FRAME, pivot: MAGE_PIVOT, clips: MAGE_CLIPS, draw: drawMage }
  : { name: 'slime', frame: SLIME_FRAME, pivot: SLIME_PIVOT, clips: SLIME_CLIPS, draw: drawSlime };
const atlas = bakeAtlas({ ...cfg, scale: bake });
const clips = (q.get('clips') ?? Object.keys(cfg.clips).join(',')).split(',');
const Z = Number(q.get('zoom') ?? 1), views = (q.get('views') ?? '0,1,2,3,4,5,6,7').split(',').map(Number), fsel = q.get('frames');
const cols = Number(q.get('cols') ?? 6), cell = cfg.frame.w * Z;
const rows = clips.length * views.length;
const c = document.getElementById('c'); const dpr = 1; c.width = cols * cell + 60; c.height = rows * cell * 0.9;
const g = c.getContext('2d'); g.fillStyle = '#6b8f6a'; g.fillRect(0, 0, c.width, c.height);
let row = 0;
for (const clip of clips) {
  const n = cfg.clips[clip].frames;
  for (const v of views) {
    for (let k = 0; k < cols; k++) {
      const f = fsel ? Number(fsel.split(',')[k]) : Math.min(n - 1, Math.round((k / Math.max(1, cols - 1)) * (n - 1)));
      drawFrame(g, atlas, clip, v, f, 50 + k * cell + cell / 2, row * cell * 0.9 + cfg.pivot.y * 0.9 * Z, Z);
    }
    g.fillStyle = '#fff'; g.font = '11px system-ui'; g.fillText(clip + ' ' + ['S','SE','E','NE','N','NW','W','SW'][v], 2, row * cell * 0.9 + 60);
    row++;
  }
}
document.getElementById('info').textContent = `${who}: ${atlasMiB(atlas)} MiB de textura (bake x${bake}), assado em ${(performance.now() - t0).toFixed(0)} ms`;
window.sheetReady = true;
</script></body></html>
