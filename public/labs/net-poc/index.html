<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aetheria — Laboratório de Rede</title>
<style>
  :root { color-scheme: dark; --bg:#12151f; --fg:#f3e8c8; --muted:#9aa3b8; --a:#6fb8ff; --b:#ff6b6b; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; touch-action:none; }
  #bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:8px 12px; background:#1b2030; }
  #bar select, #bar input, #bar button { background:#262d44; color:var(--fg); border:1px solid #3a4468; border-radius:8px; padding:6px 10px; font:inherit; }
  #status { margin-left:auto; color:var(--muted); }
  canvas { display:block; margin:0 auto; max-width:100%; }
  #help { padding:6px 12px; color:var(--muted); }
</style>
</head>
<body>
<div id="bar">
  <b>Rede (PoC)</b>
  <input id="name" value="Jogador" maxlength="14" aria-label="Nome">
  <select id="cls" aria-label="Classe"><option value="warrior">Guerreiro</option><option value="mage">Mago</option><option value="archer">Arqueiro</option><option value="cleric">Clérigo</option></select>
  <input id="url" value="" size="22" aria-label="Servidor">
  <button id="go">Entrar</button>
  <span id="status">desconectado</span>
</div>
<div id="help">Prova de conceito técnica (NÃO é arte do jogo): WASD move · mouse mira · clique ataca · 1/2/3 habilidades. O servidor decide posição, dano e morte.</div>
<canvas id="c" width="900" height="720"></canvas>
<script type="module" src="./net-client.js"></script>
</body>
</html>
