<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
  <link rel="icon" href="../../icon.svg" type="image/svg+xml" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>B1 — Cena-chave (UI de toque)</title>
<link rel="stylesheet" href="../../fonts/fonts.css" />
<style>
  /* B1 (laboratório): proposta de identidade para a interface de TOQUE, sobre uma captura do jogo real. Nada aqui entra no jogo (isso é a B5). */
  :root {
    --gold: #ffcf4a; --gold-hi: #fff0a6; --gold-lo: #c98f12; --night: #141a2e; --violet: #3b2090; --ivory: #f3e8c8;
    --life: #5fd38a; --mana: #8fb4ff; --danger: #ff6a6a; --cls: #4478e0;
  }
  html, body { margin: 0; background: #0d1020; color: var(--ivory); font-family: Nunito, system-ui, sans-serif; }
  .wrap { display: grid; place-items: center; min-height: 100vh; padding: 16px; box-sizing: border-box; gap: 14px; }
  .stage { position: relative; width: 844px; height: 390px; background: url(scene.png) center/cover; border-radius: 22px; overflow: hidden;
    box-shadow: 0 0 0 6px #05070f, 0 0 0 7px #2a2f55, 0 30px 80px rgba(0,0,0,.6); transform-origin: top center; }
  .stage.hide .ui { display: none; }
  .ui { position: absolute; inset: 0; }
  svg { display: block; }
  .abs { position: absolute; }
  .legend { max-width: 844px; font-size: 13px; line-height: 1.5; color: #c9c3ad; }
  .legend b { color: var(--gold); }
  button.toggle { background: #1b2140; color: var(--ivory); border: 1px solid #3a4180; border-radius: 12px; padding: 10px 16px; font: 800 14px Nunito; }

  /* painel de vidro azul-noite com filete dourado interno */
  .glass { background: linear-gradient(180deg, rgba(30,36,68,.92), rgba(16,20,40,.9)); border-radius: 18px;
    box-shadow: inset 0 0 0 1px rgba(255,207,74,.55), inset 0 0 0 3px rgba(20,26,46,.9), inset 0 0 0 4px rgba(255,207,74,.18), 0 6px 18px rgba(0,0,0,.45); backdrop-filter: blur(3px); }
  .name { font: 800 13px Cinzel, serif; letter-spacing: .6px; color: var(--ivory); text-shadow: 0 1px 0 #000a; }
  .num { font: 900 12px Nunito; color: #fff; text-shadow: 0 1px 2px #000c; }

  /* medalhões */
  .med { position: absolute; width: var(--s); height: var(--s); }
  .med svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
  .echo { transform-origin: center; animation: echo 2.4s ease-out infinite; }
  .echo.e2 { animation-delay: .8s; } .echo.e3 { animation-delay: 1.6s; }
  @keyframes echo { 0% { opacity: .65; transform: scale(.92); } 100% { opacity: 0; transform: scale(1.5); } }
  .ready { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { filter: drop-shadow(0 0 7px rgba(255,207,74,.9)); } }
  @media (prefers-reduced-motion: reduce) { .echo, .ready { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <div class="ui">
      <!-- ===== definições compartilhadas: gradientes, filtros e o conjunto de glifos (24×24, traço dourado) ===== -->
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a6"/><stop offset=".5" stop-color="#ffcf4a"/><stop offset="1" stop-color="#c98f12"/></linearGradient>
          <linearGradient id="gGoldH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c98f12"/><stop offset=".45" stop-color="#fff0a6"/><stop offset="1" stop-color="#ffcf4a"/></linearGradient>
          <radialGradient id="gDisc" cx=".35" cy=".28" r=".95"><stop offset="0" stop-color="#4a5192"/><stop offset=".55" stop-color="#262c5a"/><stop offset="1" stop-color="#121634"/></radialGradient>
          <radialGradient id="gAtk" cx=".35" cy=".28" r=".95"><stop offset="0" stop-color="#ffb08a"/><stop offset=".5" stop-color="#d4503f"/><stop offset="1" stop-color="#7d1f33"/></radialGradient>
          <radialGradient id="gLife" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#8dffb3"/><stop offset="1" stop-color="#2c9b5d"/></radialGradient>
          <linearGradient id="gHp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ff0b0"/><stop offset=".5" stop-color="#4fcf86"/><stop offset="1" stop-color="#2a9a5d"/></linearGradient>
          <linearGradient id="gXp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6e8cff"/><stop offset="1" stop-color="#b9ccff"/></linearGradient>
          <symbol id="i-bag" viewBox="0 0 24 24"><path d="M6.5 9.5h11l1.2 10.2a1 1 0 0 1-1 1.1H6.3a1 1 0 0 1-1-1.1z" fill="rgba(255,207,74,.18)"/><path d="M9 9.5V7.8a3 3 0 0 1 6 0v1.7M9.2 14h5.6" fill="none"/></symbol>
          <symbol id="i-hero" viewBox="0 0 24 24"><path d="M5.5 14a6.5 6.5 0 0 1 13 0v5h-13z" fill="rgba(255,207,74,.18)"/><path d="M5.5 14h13M12 7.5V4.2M9.2 17h5.6" fill="none"/></symbol>
          <symbol id="i-orb" viewBox="0 0 24 24"><circle cx="12" cy="12.5" r="6.3" fill="rgba(255,207,74,.18)"/><path d="M8.6 10.6a4 4 0 0 1 3-2.3M12 2.6v2M5.2 5.4l1.4 1.4M18.8 5.4l-1.4 1.4" fill="none"/></symbol>
          <symbol id="i-book" viewBox="0 0 24 24"><path d="M4.5 5.5h6a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 0-1.5-1.5h-6zM19.5 5.5h-6A1.5 1.5 0 0 0 12 7v12a1.5 1.5 0 0 1 1.500-1.500h6z" fill="rgba(255,207,74,.18)"/></symbol>
          <symbol id="i-map" viewBox="0 0 24 24"><path d="M3.8 7.2 9 5l6 2.2 5.2-2.2v11.8L15 19l-6-2.200-5.200 2.200z" fill="rgba(255,207,74,.18)"/><path d="M9 5v12M15 7.200V19" fill="none"/></symbol>
          <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none"/><circle cx="12" cy="12" r="7" fill="none" stroke-width="3.4" stroke-dasharray="2.55 2.55"/><circle cx="12" cy="12" r="5.6" fill="rgba(255,207,74,.12)" stroke-width="1.6"/></symbol>
          <symbol id="i-sword" viewBox="0 0 24 24"><path d="M19.800 3.200 20.800 4.200 20.200 9.600 11.200 18.600 5.400 12.800 14.400 3.800z" fill="rgba(255,240,166,.28)"/><path d="M8.600 9.700 14.300 15.400M5.300 18.700 9.300 14.700M3.800 20.200l1.800-1.800" fill="none"/><circle cx="3.600" cy="20.400" r="1.300" fill="currentColor" stroke="none"/></symbol>
          <symbol id="i-spiral" viewBox="0 0 24 24"><path d="M12 12.200c0-1.600 2.200-1.600 2.200 0S11 15.500 9.300 13.800 8 8.500 12 7.300s7.500 3.300 6.200 7.200c-1.200 3.700-6 4.800-8.700 2.600" fill="none"/></symbol>
          <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.500 2.800 6 13.500h5.200L10 21.200l8-11.400h-5.300z" fill="rgba(255,207,74,.3)"/></symbol>
          <symbol id="i-horn" viewBox="0 0 24 24"><path d="M4 14.500V9.500l11-4.500v14zM15 8.500a3.500 3.500 0 0 1 0 7M7 15l.8 4.200h2.600" fill="rgba(255,207,74,.18)"/></symbol>
          <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9.600 3h4.800M10.800 3v5.200L6.600 16a3.400 3.400 0 0 0 3 5h4.800a3.400 3.400 0 0 0 3-5l-4.200-7.800V3" fill="none"/><path d="M8.200 15.400h7.600l1.300 2.400a2.400 2.400 0 0 1-2.200 3.400H9.100A2.400 2.400 0 0 1 6.900 17.800z" fill="#5fd38a" stroke="none"/></symbol>
          <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.800 11.800 12 4.600l8.200 7.200M6 10.600V19.500h12v-8.900" fill="rgba(255,207,74,.14)"/><path d="M10.200 19.500v-5h3.600v5" fill="none"/></symbol>
          <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="url(#gGold)" stroke="#8a5d08" stroke-width="1.200"/><circle cx="12" cy="12" r="6.200" fill="none" stroke="#8a5d08" stroke-width="1" opacity=".7"/><path d="M12 7.800v8.400M9.800 10.200h3.400a1.400 1.400 0 0 1 0 2.800h-2.400a1.400 1.400 0 0 0 0 2.800h3.400" fill="none" stroke="#8a5d08" stroke-width="1.300" stroke-linecap="round"/></symbol>
          <!-- medalhão: disco azul-noite, aro dourado, filete interno violeta; --s = tamanho -->
          <symbol id="medal" viewBox="0 0 100 100">
            <circle cx="50" cy="52" r="46" fill="#000" opacity=".25"/>
            <circle cx="50" cy="50" r="46" fill="url(#gGold)"/>
            <circle cx="50" cy="50" r="42" fill="#1a1d40"/>
            <circle cx="50" cy="50" r="40" fill="url(#gDisc)"/>
            <circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="1.5"/>
            <path d="M18 36a36 36 0 0 1 64 0" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="4" stroke-linecap="round"/>
          </symbol>
        </defs>
      </svg>

      <!-- ===== cartão do herói (canto superior esquerdo) ===== -->
      <div class="abs glass" style="left:10px; top:10px; width:232px; height:62px;">
        <svg class="abs" style="left:7px; top:6px" width="50" height="50" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="47" fill="url(#gGold)"/><circle cx="50" cy="50" r="43" fill="#10142c"/>
          <circle cx="50" cy="50" r="39" fill="var(--cls)"/><circle cx="50" cy="50" r="39" fill="url(#gDisc)" opacity=".55"/>
          <g transform="translate(22 22) scale(2.300)" stroke="#fff0a6" stroke-width="1.300" stroke-linecap="round" stroke-linejoin="round" fill="none"><use href="#i-sword" width="24" height="24"/></g>
        </svg>
        <svg class="abs" style="left:38px; top:38px" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="url(#gGold)" stroke="#6b4608" stroke-width="1"/><text x="12" y="16.200" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="12" fill="#3a2600">1</text></svg>
        <div class="abs name" style="left:66px; top:6px">Guerreiro</div>
        <!-- vida: segmentos com ponta dourada -->
        <svg class="abs" style="left:64px; top:24px" width="160" height="18" viewBox="0 0 160 18">
          <rect x="0" y="0" width="160" height="18" rx="9" fill="#0a0d1f"/><rect x=".75" y=".75" width="158.500" height="16.500" rx="8.300" fill="none" stroke="#c98f12" stroke-opacity=".6"/>
          <clipPath id="cHp"><rect x="2" y="2" width="156" height="14" rx="7"/></clipPath>
          <g clip-path="url(#cHp)"><rect x="2" y="2" width="156" height="14" fill="url(#gHp)"/><rect x="2" y="2" width="156" height="5" fill="#fff" opacity=".22"/>
            <g stroke="#0a0d1f" stroke-opacity=".5" stroke-width="1.500"><path d="M40 2v14M78 2v14M116 2v14"/></g></g>
          <circle cx="158" cy="9" r="3.200" fill="url(#gGold)"/>
          <text x="80" y="13.300" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="11" fill="#fff" stroke="#000" stroke-opacity=".5" stroke-width=".6" paint-order="stroke">286 / 286</text>
        </svg>
        <svg class="abs" style="left:64px; top:46px" width="160" height="6" viewBox="0 0 160 6"><rect width="160" height="6" rx="3" fill="#0a0d1f"/><rect x="1" y="1" width="46" height="4" rx="2" fill="url(#gXp)"/></svg>
      </div>
      <!-- ouro -->
      <div class="abs glass" style="left:10px; top:78px; height:30px; padding:0 14px 0 6px; border-radius:15px; display:flex; align-items:center; gap:6px">
        <svg width="22" height="22"><use href="#i-coin"/></svg><span class="num" style="font-size:14px">60</span>
      </div>

      <!-- ===== minimapa com moldura e plaqueta da zona ===== -->
      <div class="abs glass" style="right:10px; top:10px; width:200px; height:152px; border-radius:16px">
        <div class="abs name" style="left:0; right:0; top:5px; text-align:center; font-size:12.500px">Vila de Lúmen</div>
        <div class="abs" style="left:10px; top:26px; width:180px; height:78px; border-radius:10px; background:linear-gradient(135deg,#7fb26a,#5f9955); box-shadow: inset 0 0 0 2px rgba(20,26,46,.9), inset 0 0 0 3px rgba(255,207,74,.5)">
          <svg width="180" height="78" viewBox="0 0 180 78"><g fill="#3d6b3a" opacity=".7"><rect x="30" y="14" width="14" height="9" rx="2"/><rect x="128" y="12" width="14" height="9" rx="2"/><rect x="40" y="52" width="14" height="9" rx="2"/><rect x="132" y="50" width="14" height="9" rx="2"/></g><circle cx="90" cy="39" r="7" fill="#7cc6e8" stroke="#e9d9a8" stroke-width="2"/><circle cx="96" cy="44" r="3.200" fill="#fff" stroke="#141a2e" stroke-width="1.500"/><g fill="#ffcf4a"><circle cx="60" cy="30" r="2"/><circle cx="118" cy="26" r="2"/><circle cx="76" cy="58" r="2"/></g></svg>
        </div>
        <!-- cantos ornamentados: "eco" nos cantos -->
        <svg class="abs" style="left:4px; top:22px" width="190" height="86" viewBox="0 0 190 86" fill="none" stroke="url(#gGold)" stroke-width="2" stroke-linecap="round">
          <path d="M6 14V8a4 4 0 0 1 4-4h6M184 14V8a4 4 0 0 0-4-4h-6M6 72v6a4 4 0 0 0 4 4h6M184 72v6a4 4 0 0 1-4 4h-6"/>
          <circle cx="6" cy="4" r="1.800" fill="url(#gGold)" stroke="none"/><circle cx="184" cy="4" r="1.800" fill="url(#gGold)" stroke="none"/><circle cx="6" cy="82" r="1.800" fill="url(#gGold)" stroke="none"/><circle cx="184" cy="82" r="1.800" fill="url(#gGold)" stroke="none"/>
        </svg>
        <!-- menu: 6 medalhões de 34 px (alvo de toque real ≥ 44 px com a área expandida) -->
        <div class="abs" style="left:7px; right:7px; bottom:7px; display:flex; justify-content:space-between">
          <svg width="29" height="29" viewBox="0 0 100 100" id="m1"></svg>
        </div>
      </div>
    </div>
  </div>
  <div class="legend">carregando…</div>
</div>
<script>
  // monta os medalhões do menu e os botões de ação (mesmo molde, glifos diferentes) para manter o HTML legível
  const ICON = (id, color = 'url(#gGold)') => `<g transform="translate(20.500 20.500) scale(2.480)" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><use href="#${id}" width="24" height="24"/></g>`;
  const medal = (id, ring = '') => `<use href="#medal" width="100" height="100"/>${ring}${ICON(id)}`;
  const ui = document.querySelector('.ui');
  const add = (html, style, cls = '') => { const d = document.createElement('div'); d.className = 'med ' + cls; d.style.cssText = style; d.innerHTML = html; ui.appendChild(d); return d; };
  // menu (6 medalhões dentro do cartão do minimapa)
  const menu = ['i-bag', 'i-hero', 'i-orb', 'i-book', 'i-map', 'i-gear'];
  document.querySelector('#m1').parentElement.innerHTML = menu.map((id) => `<svg width="29" height="29" viewBox="0 0 100 100">${medal(id)}</svg>`).join('');
  // ataque: botão grande, vermelho, com anéis de eco
  const echo = (c) => `<circle class="echo e1" cx="50" cy="50" r="44" fill="none" stroke="${c}" stroke-width="2"/><circle class="echo e2" cx="50" cy="50" r="44" fill="none" stroke="${c}" stroke-width="2"/><circle class="echo e3" cx="50" cy="50" r="44" fill="none" stroke="${c}" stroke-width="2"/>`;
  add(`<svg viewBox="0 0 100 100" style="overflow:visible">${echo('#ffcf4a')}<circle cx="50" cy="52" r="46" fill="#000" opacity=".28"/><circle cx="50" cy="50" r="46" fill="url(#gGold)"/><circle cx="50" cy="50" r="42" fill="#3a0f1d"/><circle cx="50" cy="50" r="40" fill="url(#gAtk)"/><path d="M18 36a36 36 0 0 1 64 0" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="4" stroke-linecap="round"/><g transform="translate(17 17) scale(2.800)" stroke="#fff6d8" stroke-width="1.400" stroke-linecap="round" stroke-linejoin="round" fill="none"><use href="#i-sword" width="24" height="24"/></g></svg>`, '--s:88px; right:14px; bottom:12px', 'atk');
  // habilidades: 3 medalhões com anel de recarga (arco) e número; a 2ª está recarregando, a 3ª pronta (pulsa)
  const ring = (frac, num) => `<circle cx="50" cy="50" r="41" fill="none" stroke="#0a0d1f" stroke-opacity=".55" stroke-width="9"/><circle cx="50" cy="50" r="41" fill="none" stroke="#8fb4ff" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(2 * Math.PI * 41 * frac).toFixed(1)} 999" transform="rotate(-90 50 50)"/><text x="50" y="62" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="30" fill="#fff" stroke="#000" stroke-opacity=".6" stroke-width="3" paint-order="stroke">${num}</text>`;
  add(`<svg viewBox="0 0 100 100">${medal('i-spiral')}</svg>`, '--s:62px; right:114px; bottom:14px', 'ready');
  add(`<svg viewBox="0 0 100 100">${medal('i-bolt')}<circle cx="50" cy="50" r="40" fill="#0a0d1f" opacity=".5"/>${ring(0.62, '4')}</svg>`, '--s:62px; right:96px; bottom:84px');
  add(`<svg viewBox="0 0 100 100">${medal('i-horn')}</svg>`, '--s:62px; right:22px; bottom:112px', 'ready');
  // poção (com contador) e voltar à vila
  add(`<svg viewBox="0 0 100 100" style="overflow:visible">${medal('i-flask')}<circle cx="82" cy="78" r="19" fill="#141a2e" stroke="url(#gGold)" stroke-width="4"/><text x="82" y="87" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="26" fill="#fff0a6">3</text></svg>`, '--s:50px; right:196px; bottom:10px');
  add(`<svg viewBox="0 0 100 100">${medal('i-home')}</svg>`, '--s:44px; right:190px; bottom:68px');
  // joystick: anel fantasma + botão (aparece onde o dedo toca)
  add(`<svg viewBox="0 0 100 100" style="overflow:visible"><circle cx="50" cy="50" r="48" fill="rgba(255,255,255,.07)" stroke="rgba(255,240,166,.55)" stroke-width="2"/><circle cx="50" cy="50" r="36" fill="none" stroke="rgba(255,240,166,.25)" stroke-width="1.500" stroke-dasharray="3 6"/><circle cx="58" cy="44" r="22" fill="rgba(255,248,220,.62)" stroke="url(#gGold)" stroke-width="3"/></svg>`, '--s:112px; left:70px; bottom:36px');

  document.querySelector('.legend').innerHTML = `<b>Proposta B1 (laboratório):</b> a cena é uma captura do jogo real (heróis em miniatura); toda a interface acima é <b>SVG/CSS desenhado à mão</b> com regras fixas — disco azul-noite, aro dourado, glifos de traço único, anel de eco na recarga e no botão de ataque, vida segmentada com ponta dourada, vidro com filete dourado e cantos ornamentados.
    Todos os alvos de toque têm ≥ 44 px (os medalhões do menu têm 29 px visíveis, mas a área tocável é maior). <b>Os glifos são provisórios</b> (um conjunto próprio de ícones precisa de artista ou de arte final).
    <br><button class="toggle" onclick="document.getElementById('stage').classList.toggle('hide')">Mostrar/ocultar interface</button>`;
  // ajusta ao tamanho da janela
  const fit = () => { const s = Math.min(1, (innerWidth - 32) / 844); document.getElementById('stage').style.transform = `scale(${s})`; document.getElementById('stage').style.marginBottom = `${-(1 - s) * 390}px`; };
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
