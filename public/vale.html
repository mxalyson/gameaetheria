<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vale de Auren — protótipo visual</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f1426; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #cap { position: fixed; left: 20px; top: 16px; color: #e9e4ff; font: 800 15px/1.3 Georgia, serif; letter-spacing: .08em; text-shadow: 0 1px 6px rgba(0,0,0,.6); pointer-events: none; }
    #cap small { display: block; font: 600 12px/1.4 system-ui, sans-serif; letter-spacing: 0; opacity: .75; }
  </style>
</head>
<body>
  <canvas id="vale"></canvas>
  <div id="cap">VALE DE AUREN<small>Protótipo jogável · Fase 4 · Canvas 2D isométrico</small></div>
  <script type="module">
    import { Vale } from './src/render/vale.js';
    const t = new URLSearchParams(location.search).get('t');
    window.vale = new Vale(document.getElementById('vale'), { fixedTime: t === null ? null : Number(t) });
  </script>
</body>
</html>
