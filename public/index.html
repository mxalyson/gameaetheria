<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1d2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Aetheria" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <title>Aetheria — Arena dos Ecos</title>
  <link href="fonts/fonts.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="hud-player">
      <div class="portrait" id="hud-portrait" data-action="toggle" data-arg="character"></div>
      <div class="bars">
        <div class="name-row"><span id="hud-name"></span><span id="hud-level"></span></div>
        <div class="bar hp" id="hud-hp-bar"><div class="fill" id="hud-hp"></div><div class="fill shield" id="hud-shield"></div><span id="hud-hp-text"></span></div>
        <div class="bar xp" id="hud-xp-bar"><div class="fill" id="hud-xp"></div><span id="hud-xp-text"></span></div>
      </div>
    </div>
    <div id="hud-gold"></div>
    <div id="hud-zone">
      <div id="zone-name"></div>
      <canvas id="minimap" width="170" height="170"></canvas>
      <div class="menu-btns" id="menu-btns">
        <button data-action="toggle" data-arg="inventory" title="Mochila"><img src="assets/icons/menu/menu-bag.webp?v=901f0c1b" alt="" draggable="false"></button>
        <button data-action="toggle" data-arg="character" title="Personagem"><img src="assets/icons/menu/menu-hero.webp?v=901f0c1b" alt="" draggable="false"></button>
        <button data-action="toggle" data-arg="spirits" title="Spirits"><img src="assets/icons/menu/menu-spirits.webp?v=901f0c1b" alt="" draggable="false"></button>
        <button data-action="toggle" data-arg="journal" title="Diário e missões"><img src="assets/icons/menu/menu-journal.webp?v=901f0c1b" alt="" draggable="false"></button>
        <button data-action="toggle" data-arg="map" title="Mapa"><img src="assets/icons/menu/menu-map.webp?v=901f0c1b" alt="" draggable="false"></button>
        <button data-action="toggle" data-arg="party" class="online-only" title="Grupo"><img src="assets/icons/menu/menu-party.webp?v=901f0c1b" alt="" draggable="false"></button>
        <button data-action="toggle" data-arg="options" title="Opções"><img src="assets/icons/menu/menu-settings.webp?v=901f0c1b" alt="" draggable="false"></button>
        <button data-action="fullscreen" class="txt" title="Tela cheia">⛶</button>
      </div>
    </div>
    <div id="ritual" class="hidden"></div>
    <div id="boss-bar" class="hidden"><div id="boss-portrait"></div><div id="boss-name"></div><div class="bar"><div class="fill" id="boss-fill"></div></div></div>
    <div id="arena-banner" class="hidden"></div>
    <div id="skillbar"></div>
    <div id="log"></div>
  </div>

  <div id="touch" class="hidden"></div>
  <div id="rotate-hint"><div><b>↻</b><p>Gire o aparelho para a horizontal</p></div></div>

  <div id="panel-layer"></div>
  <div id="tooltip" class="hidden"></div>
  <div id="toast-layer"></div>
  <div id="reward-layer"></div>
  <div id="screen"></div>

  <script type="module" src="src/main.js"></script>
  <script type="module" src="src/pwa.js"></script>
</body>
</html>
