# Alternativa ao deploy/instalar-vm.sh para quem prefere Docker: jogo (porta única) + Caddy com HTTPS automático.
# Uso: crie um arquivo .env (NÃO vai ao Git) com  DOMINIO=seu-nome.duckdns.org  e rode  docker compose up -d --build
# A imagem do jogo foi construída e testada (docs/deploy/publicar-gratis.md); este arquivo junta os dois serviços.
services:
  aetheria:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: "https://${DOMINIO:?defina DOMINIO no arquivo .env (exemplo aetheria.duckdns.org)}"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes: ["aetheria-data:/data"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${DOMINIO} --to aetheria:8080
    volumes: ["caddy-data:/data"]
    depends_on: [aetheria]
volumes:
  aetheria-data:
  caddy-data:
