# Publica a pasta public/ (o jogo, que é 100% estático) no GitHub Pages a cada push em main.
# Só usa ações oficiais do GitHub (actions/*). Para ligar: Settings → Pages → Source: "GitHub Actions".
# O jogo fica em https://mxalyson.github.io/gameaetheria/ (HTTPS, funciona no celular e pode ser instalado como app).
name: Publicar o jogo (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
